{% load static %}<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{% static 'style.css' %}"><main><section><a href="/">← Главная</a><h2>Статус заявки</h2>{% if item %}<p>Номер для отслеживания (сохраните его):</p><p style="overflow-wrap:anywhere">{{ item.code }}</p><h3>{{ item.get_status_display }}</h3>{% elif searched %}<p>Заявка не найдена.</p>{% endif %}<form action="/track/" method="get"><label for="code">Код заявки</label><input id="code" name="code" required><button class="btn">Проверить</button></form></section></main></html>
